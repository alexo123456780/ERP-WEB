name: CI/CD — EduCore ERP

on:
  push:
    branches: [prod, master]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────
  # 1. VALIDAR BACKEND (TypeScript + build)
  # ────────────────────────────────────────────────
  validate-backend:
    name: "🔍 Validar Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: "Compilar TypeScript (detecta errores)"
        working-directory: backend
        run: npm run build

  # ────────────────────────────────────────────────
  # 2. VALIDAR FRONTEND (Next.js build)
  # ────────────────────────────────────────────────
  validate-frontend:
    name: "🔍 Validar Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: "Compilar Next.js (detecta errores)"
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://erp-backend-9c1d.onrender.com/api

  # ────────────────────────────────────────────────
  # 3. DESPLEGAR BACKEND en Render
  # ────────────────────────────────────────────────
  deploy-backend:
    name: "🚀 Deploy Backend → Render"
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]
    steps:
      - name: Disparar deploy y esperar resultado
        run: |
          set -e
          SVC_ID="${{ secrets.RENDER_BACKEND_SERVICE_ID }}"
          TOKEN="${{ secrets.RENDER_API_KEY }}"
          BASE="https://api.render.com/v1"

          echo "=== Iniciando deploy del backend ==="

          # Render devuelve 202 sin body — disparar y luego obtener el ID del listado
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/services/$SVC_ID/deploys")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Error al disparar deploy (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "✅ Deploy disparado — esperando que aparezca en el listado..."
          sleep 5

          # Obtener el deploy más reciente
          DEPLOY_ID=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/services/$SVC_ID/deploys?limit=1" | \
            python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          dep = d[0].get('deploy', d[0]) if d else {}
          print(dep.get('id', ''))
          " 2>/dev/null || echo "")

          if [ -z "$DEPLOY_ID" ]; then
            echo "❌ No se pudo obtener el Deploy ID del listado"
            exit 1
          fi

          echo "✅ Monitoreando deploy: $DEPLOY_ID"

          for i in $(seq 1 60); do
            RESULT=$(curl -s \
              -H "Authorization: Bearer $TOKEN" \
              "$BASE/services/$SVC_ID/deploys/$DEPLOY_ID")

            STATUS=$(echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          dep = d.get('deploy', d)
          print(dep.get('status', 'unknown'))
          " 2>/dev/null || echo "unknown")

            echo "[$i/60] $(date +%H:%M:%S) → $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo ""
              echo "✅ Backend DESPLEGADO exitosamente!"
              echo "🌐 https://erp-backend-9c1d.onrender.com/api"
              exit 0
            fi
            if echo "$STATUS" | grep -qE "failed|deactivated|canceled"; then
              echo ""
              echo "❌ Deploy FALLÓ: $STATUS"
              echo "📋 https://dashboard.render.com/web/srv-d76tdepaae7s73dggng0"
              exit 1
            fi
            sleep 20
          done
          echo "⚠️ Timeout después de 20 min"
          exit 1

  # ────────────────────────────────────────────────
  # 4. DESPLEGAR FRONTEND en Render
  # ────────────────────────────────────────────────
  deploy-frontend:
    name: "🚀 Deploy Frontend → Render"
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Disparar deploy y esperar resultado
        run: |
          set -e
          SVC_ID="${{ secrets.RENDER_FRONTEND_SERVICE_ID }}"
          TOKEN="${{ secrets.RENDER_API_KEY }}"
          BASE="https://api.render.com/v1"

          echo "=== Iniciando deploy del frontend ==="

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/services/$SVC_ID/deploys")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Error al disparar deploy (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "✅ Deploy disparado — esperando que aparezca en el listado..."
          sleep 5

          DEPLOY_ID=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/services/$SVC_ID/deploys?limit=1" | \
            python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          dep = d[0].get('deploy', d[0]) if d else {}
          print(dep.get('id', ''))
          " 2>/dev/null || echo "")

          if [ -z "$DEPLOY_ID" ]; then
            echo "❌ No se pudo obtener el Deploy ID"
            exit 1
          fi

          echo "✅ Monitoreando deploy: $DEPLOY_ID"

          for i in $(seq 1 60); do
            RESULT=$(curl -s \
              -H "Authorization: Bearer $TOKEN" \
              "$BASE/services/$SVC_ID/deploys/$DEPLOY_ID")

            STATUS=$(echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          dep = d.get('deploy', d)
          print(dep.get('status', 'unknown'))
          " 2>/dev/null || echo "unknown")

            echo "[$i/60] $(date +%H:%M:%S) → $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo ""
              echo "✅ Frontend DESPLEGADO exitosamente!"
              echo "🌐 https://erp-frontend-ywij.onrender.com"
              exit 0
            fi
            if echo "$STATUS" | grep -qE "failed|deactivated|canceled"; then
              echo ""
              echo "❌ Deploy FALLÓ: $STATUS"
              echo "📋 https://dashboard.render.com/web/srv-d76td6paae7s73dgghv0"
              exit 1
            fi
            sleep 20
          done
          echo "⚠️ Timeout después de 20 min"
          exit 1

  # ────────────────────────────────────────────────
  # 5. RESUMEN FINAL
  # ────────────────────────────────────────────────
  summary:
    name: "📋 Resumen del despliegue"
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Mostrar resultado
        run: |
          BACKEND="${{ needs.deploy-backend.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"
          echo "=================================="
          echo "  RESULTADO DEL DESPLIEGUE"
          echo "=================================="
          if [ "$BACKEND" = "success" ]; then
            echo "✅ Backend:  https://erp-backend-9c1d.onrender.com/api"
          else
            echo "❌ Backend:  FALLÓ ($BACKEND)"
          fi
          if [ "$FRONTEND" = "success" ]; then
            echo "✅ Frontend: https://erp-frontend-ywij.onrender.com"
          else
            echo "❌ Frontend: FALLÓ ($FRONTEND)"
          fi
          echo "=================================="
          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ]; then
            exit 1
          fi
