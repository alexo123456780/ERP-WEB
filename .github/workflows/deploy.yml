name: CI/CD — EduCore ERP

on:
  push:
    branches: [prod, master]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────
  # 1. VALIDAR BACKEND (TypeScript + build)
  # ────────────────────────────────────────────────
  validate-backend:
    name: "🔍 Validar Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: "Compilar TypeScript (detecta errores de tipo)"
        working-directory: backend
        run: npm run build

  # ────────────────────────────────────────────────
  # 2. VALIDAR FRONTEND (Next.js build)
  # ────────────────────────────────────────────────
  validate-frontend:
    name: "🔍 Validar Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: "Compilar Next.js (detecta errores de build)"
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://erp-backend-9c1d.onrender.com/api

  # ────────────────────────────────────────────────
  # 3. DESPLEGAR BACKEND en Render
  # ────────────────────────────────────────────────
  deploy-backend:
    name: "🚀 Deploy Backend → Render"
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]
    outputs:
      deploy_id: ${{ steps.trigger.outputs.deploy_id }}
    steps:
      - name: Disparar deploy en Render
        id: trigger
        run: |
          echo "Iniciando deploy del backend..."
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -d '{"clearCache": false}')
          echo "Respuesta Render: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deploy ID: $DEPLOY_ID"

      - name: Esperar resultado del deploy
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          echo "Monitoreando deploy $DEPLOY_ID..."
          for i in $(seq 1 40); do
            RESULT=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys/$DEPLOY_ID" 2>/dev/null || echo '{"status":"unknown"}')
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "[$i/40] Estado: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "✅ Backend desplegado exitosamente!"
              echo "🌐 URL: https://erp-backend-9c1d.onrender.com/api"
              exit 0
            fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "canceled" ]; then
              echo "❌ Deploy falló con estado: $STATUS"
              echo "Revisa los logs en: https://dashboard.render.com"
              exit 1
            fi
            sleep 15
          done
          echo "⚠️ Timeout esperando deploy (revisa Render dashboard)"
          exit 1

  # ────────────────────────────────────────────────
  # 4. DESPLEGAR FRONTEND en Render
  # ────────────────────────────────────────────────
  deploy-frontend:
    name: "🚀 Deploy Frontend → Render"
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Disparar deploy en Render
        id: trigger
        run: |
          echo "Iniciando deploy del frontend..."
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys" \
            -d '{"clearCache": false}')
          echo "Respuesta Render: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deploy ID: $DEPLOY_ID"

      - name: Esperar resultado del deploy
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          echo "Monitoreando deploy $DEPLOY_ID..."
          for i in $(seq 1 40); do
            RESULT=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys/$DEPLOY_ID" 2>/dev/null || echo '{"status":"unknown"}')
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "[$i/40] Estado: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "✅ Frontend desplegado exitosamente!"
              echo "🌐 URL: https://erp-frontend-ywij.onrender.com"
              exit 0
            fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "canceled" ]; then
              echo "❌ Deploy falló con estado: $STATUS"
              echo "Revisa los logs en: https://dashboard.render.com"
              exit 1
            fi
            sleep 15
          done
          echo "⚠️ Timeout esperando deploy (revisa Render dashboard)"
          exit 1

  # ────────────────────────────────────────────────
  # 5. RESUMEN FINAL
  # ────────────────────────────────────────────────
  summary:
    name: "📋 Resumen del despliegue"
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Mostrar resultado
        run: |
          BACKEND="${{ needs.deploy-backend.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"
          echo "=================================="
          echo "  RESULTADO DEL DESPLIEGUE"
          echo "=================================="
          if [ "$BACKEND" = "success" ]; then
            echo "✅ Backend:  https://erp-backend-9c1d.onrender.com/api"
          else
            echo "❌ Backend:  FALLÓ ($BACKEND)"
          fi
          if [ "$FRONTEND" = "success" ]; then
            echo "✅ Frontend: https://erp-frontend-ywij.onrender.com"
          else
            echo "❌ Frontend: FALLÓ ($FRONTEND)"
          fi
          echo "=================================="
          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ]; then
            exit 1
          fi
