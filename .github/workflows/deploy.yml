name: Build & Deploy to Oracle Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/erp-web-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/erp-web-frontend

jobs:
  # ──────────────────────────────────────────────────────
  # JOB 1: Build & Push Docker images to GHCR
  # ──────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────
  # JOB 2: Deploy to Oracle Cloud VPS via SSH
  # ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -e

            # Authenticate to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull latest images
            docker pull $BACKEND_IMAGE:latest
            docker pull $FRONTEND_IMAGE:latest

            # Update image refs in .env
            sed -i "s|BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_IMAGE:latest|" ~/erp-web/docker/.env
            sed -i "s|FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_IMAGE:latest|" ~/erp-web/docker/.env

            # Restart services (zero downtime for db)
            docker compose -f ~/erp-web/docker/docker-compose.prod.yml up -d --no-deps backend frontend nginx

            # Remove dangling images
            docker image prune -f

            echo "✅ Deploy completed successfully"
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
